
<app-background-art/>

<div class="files-page">

  <!-- Currently using this as spacer -->
  <div class="side-panel-card-container" *ngIf="!readingMode"></div>

  <div class="pdf-container" id="pdf-container">
    <!-- Images wont be rendered in object -->
    @switch (fileType) {
      @case (fileType && fileTypes.IMAGES.includes(fileType)) {
        <div class="image-container" *ngIf="file">
          <img [src]="file" alt="Uploaded Image">
        </div>
      }
      @case (fileType && fileTypes.DOCUMENTS.includes(fileType)) {
          <iframe *ngIf="file" [src]="file" class="pdf-iframe"></iframe>
      }
      @default {
          <h2>Oh no!</h2>
          <p>The requested resource cannot be rendered</p>
      }
    }
    <span *ngIf="!file">
      <h2>Oh no!</h2>
      <p>The file you're looking for does not exist!</p>
    </span>
  </div>

  <!-- sidebar right (comments etc.) -->
  <div class="side-panel-card-container" *ngIf="file && !readingMode">
    <card>
      <div class="filter-container">
        <h2>Comments</h2>
      </div>
    </card>
  </div>
</div>

<div class="tools" *ngIf="file && !readingMode">
  <div class="tool-item" title="Highlight Text">
    <button>
      <!-- @ToDo: Add SVGs -->
      <svg width="40" height="40" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"></svg>
      <span>Highlight</span>
    </button>
  </div>
  <div class="tool-item" title="Add Comment">
    <button>
        <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"></svg>
        <span>Comment</span>
    </button>
  </div>
  <div class="tool-item" title="Draw Markings">
    <button>
      <svg width="40" height="40" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"></svg>
      <span>Draw</span>
    </button>
  </div>
  <div class="tool-item" title="Erase Markings">
    <button>
      <svg width="40" height="40" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"></svg>
      <span>Erase</span>
    </button>
  </div>
  <div class="tool-item" title="Reading Mode">
    <button (click)="toggleReadingMode()">
        <svg width="40" height="40" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
            <circle cx="13" cy="25" r="7" stroke="black" stroke-width="2" fill="transparent"/>
            <circle cx="37" cy="25" r="7" stroke="black" stroke-width="2" fill="transparent"/>
            <path d="M 20 25, Q 25 20, 30 25" stroke="black" stroke-width="2" fill="transparent"/>
        </svg>
        <span>Read</span>
    </button>
  </div>
</div>

<div class="tool-item">
  <button (click)="toggleReadingMode()" *ngIf="file && readingMode" class="edit-mode-btn">
    <svg width="40" height="40" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 32, 15 25, 25 9, 35 15, 25 30, 17 32, m20 20" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      <path d="M15 24, 25 30"></path>
      <path d="M17 37 Q 20 35, 25 40 Q 30 45, 35 40"/>
    </svg>
    <span>Edit</span>
  </button>
</div>
