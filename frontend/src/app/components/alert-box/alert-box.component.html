<div class="modal-container">
  <div class="modal">
    <div class="modal-hd">{{ modalHeader }}</div>
    <div class="modal-txt">{{ modalText }}</div>
    <div class="modal-btns">
      <div *ngIf="canDeny()" class="modal-deny-btn" (click)="onDeny()">{{ denyButtonText }}</div>
      <div class="modal-confirm-btn" (click)="onConfirm()">{{ confirmButtonText }}</div>
    </div>
  </div>
</div>
