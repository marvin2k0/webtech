<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<app-background-art/>
<alert-box
  *ngIf="!successful && modalShown"
  [modalHeader]="'Error'"
  [modalText]="errorMessage"
  [confirmButtonText]="'Got it!'"
  [onConfirmCallback]="handleConfirm">
</alert-box>

<div class="form-card-container">
  <div class="card-container">
    <card>
      <div class="form-container">
        <h1>{{ "signup_create_account" | translate }}</h1>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <div class="inputs-container">
            <div class="form-element">
              <label for="username">{{ "signup_form_username" | translate }}</label>
              <input autocomplete="username" type="text" name="username" id="username" placeholder="{{ 'signup_form_username_placeholder' | translate }}" required
                     formControlName="username">
            </div>
            <div class="form-element">
              <label for="email">{{ "signup_form_your_email" | translate }}</label>
              <input autocomplete="email" type="email" name="email" id="email" placeholder="{{ 'signup_form_your_email_placeholder' | translate }}" required
                     formControlName="email">
            </div>
            <div class="form-element">
              <label for="password">{{ "signup_form_password" | translate }}</label>
              <input autocomplete="new-password" type="password" name="password" id="password" placeholder="••••••••"
                     required formControlName="password" (blur)="registerForm.get('password')?.markAsTouched()">
            </div>
            <div class="form-element">
              <label for="confirm-password">{{ "signup_form_confirm_password" | translate }}</label>
              <input autocomplete="new-password" type="password" name="confirm-password" id="confirm-password"
                     placeholder="••••••••" required formControlName="passwordConfirm">
            </div>
          </div>

          <div class="form-checkbox">
            <input id="terms" aria-describedby="terms" type="checkbox" class="custom-checkbox" required
                   formControlName="acceptTos">
            <label for="terms">{{ "signup_i_accept" | translate }}
              <a>{{ "signup_terms_and_conditions" | translate }}</a></label>
          </div>

          <div class="hint-txt"
               *ngIf="registerForm.get('password')?.errors?.['minlength'] && registerForm.get('password')?.touched">
            Password must be at least 6 characters long.
          </div>

          <button class="cta-button wide" type="submit"
                  [disabled]="!registerForm.valid">{{ "signup_create_account" | translate }}
          </button>

          <p>
            {{ "already_have_account" | translate }} <a routerLink="/signin">{{ "sign_in_here" | translate }}</a>
          </p>
        </form>
      </div>
    </card>
  </div>
</div>
