<h1 style="color: red; text-align: center; margin-bottom: 5rem;">STILL WORK IN PROGRESS</h1>

<div class="container">
  <div class="course-info-container">
    <h1>{{ course.name }}</h1>
    <p>{{ course.description }}</p>
  </div>
  <div class="course-activity-container">
    <app-post-card />
  </div>
  <div class="course-members-container">
    <h2>Members</h2>
    <ul>
      @for (member of course.members; track member) {
        <li>{{ member }}</li>
      }
    </ul>
  </div>
</div>
